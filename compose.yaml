services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://darkroom:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/darkroom
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-[]}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    networks: [default, cloudflared]

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: darkroom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: darkroom
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darkroom"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Nightly pg_dump to ./backups (14 days kept). Restore: see README "Backups and restore".
  backup:
    build: ops/backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: darkroom
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATABASE: darkroom
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups

volumes:
  dbdata:

networks:
  cloudflared:
    external: true
    name: ${CLOUDFLARED_NETWORK:-cloudflared}
