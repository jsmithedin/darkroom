name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy backend/app
      # Docker is available on hosted runners, so testcontainers starts Postgres as usual.
      - run: uv run pytest

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: darkroom-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image starts (catches runtime-only dependency misses)
        run: docker run --rm -e PYTHONPATH=/srv/backend darkroom-ci:latest python -c "import app.main"
      - name: Compose file is valid and publishes no ports
        run: |
          docker compose --env-file .env.example config > /tmp/compose.json
          if grep -q '^\s*ports:' /tmp/compose.json; then
            echo "compose.yaml must not publish ports"; exit 1
          fi
