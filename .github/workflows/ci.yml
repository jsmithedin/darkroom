name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy backend/app
      # Docker is available on hosted runners, so testcontainers starts Postgres as usual.
      # Coverage is a floor, not a target: it was 97% when this was set.
      - run: uv run pytest --cov=backend/app --cov-fail-under=95

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --coverage
      - run: npm run build

  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: darkroom-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image starts (catches runtime-only dependency misses)
        run: docker run --rm -e PYTHONPATH=/srv/backend darkroom-ci:latest python -c "import app.main"
      - name: Backup and restore scripts work end to end
        run: ops/backup/selftest.sh
      - name: Compose file is valid and publishes no ports
        run: |
          docker compose --env-file .env.example config > /tmp/compose.json
          if grep -q '^\s*ports:' /tmp/compose.json; then
            echo "compose.yaml must not publish ports"; exit 1
          fi

  skills:
    name: skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Skills are valid and share the same rules
        run: python scripts/sync_skill_rules.py --check
      - name: Zips build
        run: python scripts/build_skill_zips.py "$RUNNER_TEMP/zips"
