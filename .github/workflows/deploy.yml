name: Deploy

# Runs on the NUC's self-hosted runner after CI succeeds for a push to main.
# Never triggered by pull requests, so PR code cannot reach the runner.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Queue deploys rather than cancelling one half way through.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.repository == 'jsmithedin/darkroom'
    runs-on: [self-hosted, nuc]
    env:
      # Must match the project name of the existing deployment so the db volume is reused.
      COMPOSE_PROJECT_NAME: darkroom
      # Real secrets live on the NUC, outside the repo (repo variable, not a secret).
      ENV_FILE: ${{ vars.DEPLOY_ENV_FILE }}
      PUBLIC_URL: ${{ vars.DEPLOY_HEALTH_URL }}
    steps:
      - name: Check configuration
        run: |
          test -n "$ENV_FILE" || { echo "Set repo variable DEPLOY_ENV_FILE"; exit 1; }
          test -r "$ENV_FILE" || { echo "$ENV_FILE is not readable by the runner user"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Build and start
        run: docker compose --env-file "$ENV_FILE" up -d --build --remove-orphans

      - name: Wait for the app to be healthy
        run: |
          for i in $(seq 1 30); do
            if docker compose --env-file "$ENV_FILE" exec -T app python -c \
              "import json,urllib.request as u; d=json.load(u.urlopen('http://localhost:8000/api/health')); raise SystemExit(0 if d.get('db') is True else 1)" \
              2>/dev/null; then
              echo "app healthy after ~$((i*2))s"; exit 0
            fi
            sleep 2
          done
          echo "App did not become healthy"; exit 1

      - name: Check the public URL
        if: env.PUBLIC_URL != ''
        run: |
          for i in $(seq 1 15); do
            if curl -fsS --max-time 10 "$PUBLIC_URL" | grep -q '"db":true'; then
              echo "public health ok"; exit 0
            fi
            sleep 2
          done
          echo "Public health check failed: $PUBLIC_URL"; exit 1

      - name: Show logs on failure
        if: failure()
        run: docker compose --env-file "$ENV_FILE" logs app --tail 50

      - name: Prune old images
        if: success()
        run: docker image prune -f
